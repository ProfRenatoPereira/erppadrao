<!-- login/professor_painel_secreto.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Secreto do Docente</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans p-6 min-h-screen flex items-center justify-center">

    <div class="max-w-2xl w-full bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
        <header class="border-b border-slate-700 pb-3 mb-4 flex justify-between items-center">
            <div>
                <h1 class="text-lg font-black text-amber-400 uppercase tracking-wider">🤫 Painel Secreto do Professor</h1>
                <p class="text-xs text-slate-400">Controle de Contingência de Acesso e Reset de Senhas das Equipes</p>
            </div>
            <a href="/" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-slate-300 font-bold transition">⬅️ Voltar</a>
        </header>

        <!-- Formulário para Modificar ou Forçar Senha de uma Equipe -->
        <div class="bg-slate-850 p-4 rounded-xl border border-slate-700 mb-6">
            <h3 class="text-xs font-bold text-slate-300 uppercase mb-3">Changer / Forçar Nova Senha</h3>
            <form id="formResetSenha" onsubmit="forcarNovaSenha(event)" class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-sm">
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Equipe alvo:</label>
                    <select id="reset_usuario" class="w-full border border-slate-600 bg-slate-900 p-2 rounded-lg outline-none text-white focus:border-amber-400">
                        <option value="equipe_alfa">Equipe Alfa</option>
                        <option value="equipe_beta">Equipe Beta</option>
                        <option value="equipe_gama">Equipe Gama</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Nova Senha Didática:</label>
                    <input type="text" id="reset_senha" value="teradmas2026" required class="w-full border border-slate-600 bg-slate-900 p-2 rounded-lg outline-none text-white focus:border-amber-400">
                </div>
                <div class="flex items-end">
                    <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2 rounded-lg text-xs uppercase tracking-wider transition">Aplicar Reset</button>
                </div>
            </form>
        </div>

        <!-- Monitor de Status em Tempo Real -->
        <div class="bg-slate-850 rounded-xl border border-slate-700 overflow-hidden">
            <div class="p-3 bg-slate-700 text-xs font-bold text-slate-200 uppercase">Credenciais Correntes Ativas</div>
            <div class="overflow-x-auto">
                <table class="w-full text-xs text-left">
                    <thead class="bg-slate-900 text-slate-400 uppercase font-bold border-b border-slate-700">
                        <tr>
                            <th class="p-3">Equipe</th>
                            <th class="p-3">Senha de Acesso Atual</th>
                            <th class="p-3 text-center">Ação Emergencial</th>
                        </tr>
                    </thead>
                    <tbody id="tabela_senhas_professor" class="divide-y divide-slate-700 text-slate-300">
                        <!-- Alimentação direta via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/login/professor_secreto.js"></script>
</body>
</html>
