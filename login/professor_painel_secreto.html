    <script>
        let tamanhoFonteAtual = 16;
        document.addEventListener("DOMContentLoaded", carregarEquipesDoBanco);

        function mudarFonte(dir) {
            tamanhoFonteAtual += dir;
            document.documentElement.style.fontSize = Math.max(12, Math.min(24, tamanhoFonteAtual)) + 'px';
        }
        
        function alternarModoEscuro() { 
            document.body.classList.toggle('dark-mode'); 
            const btn = document.getElementById('btn_tema');
            btn.innerText = document.body.classList.contains('dark-mode') ? "☀️ Claro" : "🌙 Escuro";
        }

        async function carregarEquipesDoBanco() {
            try {
                const res = await fetch('/api/professor/listar');
                
                // Evita quebra na leitura se o backend retornar HTML (ex: redirecionamento de sessão expirada)
                const contentType = res.headers.get("content-type");
                if (!contentType || !contentType.includes("application/json")) {
                    throw new Error("Resposta inválida do servidor.");
                }

                const dados = await res.json();
                const tbody = document.getElementById('tabela_professor');
                
                if (!dados || dados.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #94a3b8; font-style: italic; padding: 12px;">Nenhuma credencial estudantil localizada no Supabase.</td></tr>`;
                    return;
                }

                tbody.innerHTML = dados.map(e => `
                    <tr style="font-family: monospace;">
                        <td style="font-weight: bold; color: #1e3a8a; font-size: 13px;">${e.equipe_id}</td>
                        <td style="font-family: sans-serif;"><strong>${e.nome_empresa}</strong></td>
                        <td style="font-weight: bold; color: #475569;">${e.senha}</td>
                        <td style="text-align: center;">
                            <button onclick="removerEquipe(${e.id})" style="background-color: #fee2e2; color: #ef4444; border: 1px solid #fca5a5; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 10px; font-weight: bold; font-family: sans-serif; text-transform: uppercase;">Excluir</button>
                        </td>
                    </tr>`).join('');
            } catch (err) {
                console.error("Erro ao processar carga do Supabase: ", err);
                const tbody = document.getElementById('tabela_professor');
                if (tbody) {
                    tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #ef4444; font-weight: bold; padding: 12px;">Falha ao carregar dados. Sua sessão pode ter expirado.</td></tr>`;
                }
            }
        }

        async function salvarCredencialEquipe(e) {
            e.preventDefault();
            const dados = {
                equipe_id: document.getElementById('prof_equipe_id').value.trim().toLowerCase(),
                senha: document.getElementById('prof_senha').value.trim(),
                nome_empresa: document.getElementById('prof_nome_empresa').value.trim().toUpperCase()
            };

            try {
                const res = await fetch('/api/professor/salvar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });

                if (res.ok) {
                    document.getElementById('formProfessor').reset();
                    carregarEquipesDoBanco();
                } else {
                    const errData = await res.json().catch(() => ({}));
                    alert("❌ Erro ao salvar credencial no Supabase: " + (errData.error || "Acesso negado ou dados inválidos."));
                }
            } catch (err) {
                console.error(err);
                alert("❌ Erro de Comunicação: O servidor não respondeu à solicitação.");
            }
        }

        async function removerEquipe(id) {
            if(!confirm('Deseja deletar permanentemente esta credencial? A equipe perderá acesso imediato.')) return;
            
            try {
                const res = await fetch(`/api/professor/deletar/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    carregarEquipesDoBanco();
                } else {
                    const errData = await res.json().catch(() => ({}));
                    alert("❌ Erro ao remover equipe: " + (errData.error || "Operação não autorizada."));
                }
            } catch (err) {
                console.error(err);
                alert("❌ Erro de Comunicação: Falha ao processar a exclusão.");
            }
        }
    </script>
</body>
</html>
